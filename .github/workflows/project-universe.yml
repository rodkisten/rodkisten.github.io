name: Project Universe
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [master]
    paths: ['.github/workflows/project-universe.yml', 'scripts/project-universe.mjs']
permissions:
  contents: write
  actions: read
  pull-requests: read
  deployments: read
concurrency:
  group: project-universe
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Create optional publishing App token
        if: ${{ vars.PROJECT_UNIVERSE_APP_ID != '' }}
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROJECT_UNIVERSE_APP_ID }}
          private-key: ${{ secrets.PROJECT_UNIVERSE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate generator syntax
        run: node --check scripts/project-universe.mjs
      - name: Generate project cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_RADAR_TOKEN || github.token }}
        run: node scripts/project-universe.mjs
      - name: Verify generated dashboard
        run: |
          grep -q '<!-- project-universe:start -->' README.md
          test "$(find assets/projects -name '*.svg' | wc -l)" -gt 0
          echo "### Project Universe" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated SVGs: $(find assets/projects -name '*.svg' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
      - name: Publish changed cards
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$APP_SLUG" ]; then
            BOT_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          fi
          git add -A -- README.md assets/projects
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh project universe [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master
