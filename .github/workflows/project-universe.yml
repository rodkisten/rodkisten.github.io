name: Project Universe
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [master]
    paths: ['.github/workflows/project-universe.yml', 'scripts/project-universe.mjs']
permissions:
  contents: write
concurrency:
  group: project-universe
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate project cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_RADAR_TOKEN || github.token }}
        run: node scripts/project-universe.mjs
      - name: Publish changed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md assets/projects
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh project universe [skip ci]'
          git push
