name: Build tools and deploy Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.deploy-check.outputs.should_deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # -----------------------------------------------------------------------
      # Marca o instante imediatamente anterior ao build.
      #
      # Isso permite descobrir outputs escritos pelo Rolldown mesmo caso
      # scripts/rolldown.config.mjs não gere corretamente o manifest
      # .cache/ts-iife-outputs.txt.
      # -----------------------------------------------------------------------
      - name: Mark build start
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/ts-iife-build-start"

      - name: Build every TypeScript tool as IIFE
        shell: bash
        run: |
          set -euo pipefail

          npx --yes rolldown@1 \
            --config scripts/rolldown.config.mjs

      # -----------------------------------------------------------------------
      # Descobre outputs por três mecanismos:
      #
      # 1. Manifest criado pelo rolldown.config.mjs
      # 2. Arquivos JS escritos depois do início do build
      # 3. Arquivos JS modificados/deletados segundo o Git
      #
      # Assim o workflow não depende mais exclusivamente do manifest.
      # -----------------------------------------------------------------------
      - name: Detect generated JavaScript
        id: generated
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST=".cache/ts-iife-outputs.txt"
          DETECTED="$RUNNER_TEMP/ts-iife-generated-files.txt"
          BUILD_START="$RUNNER_TEMP/ts-iife-build-start"

          : > "$DETECTED"

          add_candidate() {
            local path="${1:-}"

            # Remove CR de arquivos eventualmente escritos com CRLF.
            path="${path//$'\r'/}"

            # Remove prefixo ./.
            path="${path#./}"

            # Aceita também paths absolutos emitidos pelo script de build.
            if [[ "$path" == "$GITHUB_WORKSPACE/"* ]]; then
              path="${path#"$GITHUB_WORKSPACE/"}"
            fi

            [[ -z "$path" ]] && return 0

            case "$path" in
              *.js|*.mjs|*.cjs)
                ;;
              *)
                return 0
                ;;
            esac

            # Aceita:
            # - arquivos existentes
            # - symlinks
            # - arquivos tracked que acabaram de ser removidos
            if [[ -e "$path" || -L "$path" ]] || \
               git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              printf '%s\n' "$path" >> "$DETECTED"
            fi
          }

          echo "::group::Manifest generated by Rolldown"

          if [[ -s "$MANIFEST" ]]; then
            echo "Found manifest: $MANIFEST"
            cat "$MANIFEST"

            while IFS= read -r output || [[ -n "$output" ]]; do
              add_candidate "$output"
            done < "$MANIFEST"
          else
            echo "Manifest not found or empty: $MANIFEST"
            echo "Falling back to filesystem/Git discovery."
          fi

          echo "::endgroup::"

          # -------------------------------------------------------------------
          # Detecta arquivos JS realmente escritos pelo build.
          #
          # Isso inclusive encontra novos arquivos que estejam no .gitignore.
          # -------------------------------------------------------------------
          echo "::group::Files written by build"

          while IFS= read -r -d '' output; do
            output="${output#./}"

            echo "$output"
            add_candidate "$output"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path './node_modules' \
                -o -path './.cache' \
                -o -path './.pages' \
              \) -prune \
              -o \
              -type f \
              \( \
                -name '*.js' \
                -o -name '*.mjs' \
                -o -name '*.cjs' \
              \) \
              -newer "$BUILD_START" \
              -print0
          )

          echo "::endgroup::"

          # -------------------------------------------------------------------
          # Detecta modificações de arquivos que já eram tracked.
          # -------------------------------------------------------------------
          echo "::group::Tracked JavaScript changes"

          while IFS= read -r -d '' output; do
            case "$output" in
              *.js|*.mjs|*.cjs)
                echo "$output"
                add_candidate "$output"
                ;;
            esac
          done < <(
            git diff \
              --name-only \
              --diff-filter=ACMRTD \
              -z
          )

          echo "::endgroup::"

          # -------------------------------------------------------------------
          # Detecta arquivos novos visíveis pelo Git.
          #
          # O find acima já cobre também os ignored que acabaram de ser
          # gerados, mas mantemos isso como uma segunda camada.
          # -------------------------------------------------------------------
          echo "::group::Untracked JavaScript"

          while IFS= read -r -d '' output; do
            case "$output" in
              *.js|*.mjs|*.cjs)
                echo "$output"
                add_candidate "$output"
                ;;
            esac
          done < <(
            git ls-files \
              --others \
              --exclude-standard \
              -z
          )

          echo "::endgroup::"

          # Remove duplicatas.
          sort -u "$DETECTED" -o "$DETECTED"

          echo
          echo "============================================================"
          echo "Generated JavaScript detected"
          echo "============================================================"

          if [[ ! -s "$DETECTED" ]]; then
            echo "No generated JavaScript detected."
            echo
            echo "Current repository status:"
            git status --short

            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$DETECTED"

          echo
          echo "Staging generated files..."

          # -------------------------------------------------------------------
          # -f é proposital.
          #
          # Outputs compilados frequentemente estão no .gitignore.
          # Como queremos explicitamente commitá-los, precisamos forçar.
          #
          # -A também registra remoções.
          # -------------------------------------------------------------------
          while IFS= read -r output || [[ -n "$output" ]]; do
            [[ -z "$output" ]] && continue

            echo "git add: $output"

            git add \
              -f \
              -A \
              -- "$output"
          done < "$DETECTED"

          echo
          echo "============================================================"
          echo "Staged generated files"
          echo "============================================================"

          git diff \
            --cached \
            --name-status

          if git diff --cached --quiet; then
            echo
            echo "Generated JavaScript is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated JavaScript
        if: steps.generated.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Files being committed:"
          git diff \
            --cached \
            --name-status

          git commit \
            -m "chore(build): update generated IIFE files [skip ci]"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

      - name: Prepare Pages directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .pages
          mkdir -p .pages

          rsync \
            -a \
            ./ \
            .pages/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cache/' \
            --exclude '.pages/' \
            --exclude 'node_modules/' \
            --exclude 'scripts/' \
            --exclude '*.ts' \
            --exclude '*.map'

          touch .pages/.nojekyll

          echo
          echo "============================================================"
          echo "GitHub Pages contents"
          echo "============================================================"

          find .pages \
            -type f \
            -print \
            | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

      - name: Mark deploy as ready
        id: deploy-check
        shell: bash
        run: |
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build

    if: needs.build.outputs.should_deploy == 'true'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
