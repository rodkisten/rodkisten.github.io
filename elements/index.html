<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080907" />
  <meta
    name="description"
    content="RodElements: uma micro API DOM ultra performática para userscripts, interfaces e ferramentas high-tech."
  />
  <title>RodElements — DOM encaixado. Performance destravada.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      color-scheme: dark;

      /* Paleta própria: tinta, osso, líquen, ferrugem e cobre oxidado. */
      --ink-950: #080907;
      --ink-900: #0d100c;
      --ink-850: #121610;
      --ink-800: #171c15;
      --bone-50: #f3f1e6;
      --bone-100: #e9e5d6;
      --bone-300: #c2c0ad;
      --bone-500: #8d9181;
      --lichen-300: #c9ff5a;
      --lichen-400: #aeea39;
      --ember-300: #ff8f64;
      --ember-400: #ff6f3f;
      --verdigris-300: #6bd7b2;
      --verdigris-500: #278a73;
      --saffron-300: #ffd369;
      --saffron-500: #c38b21;

      --text: var(--bone-50);
      --muted: #a2a697;
      --line: rgba(233, 229, 214, 0.12);
      --line-strong: rgba(201, 255, 90, 0.42);
      --panel: rgba(18, 22, 16, 0.82);
      --panel-solid: #151a13;
      --shadow:
        0 28px 90px rgba(0, 0, 0, 0.48),
        0 1px 0 rgba(255, 255, 255, 0.04) inset;

      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --max: 1200px;
      --ease-out: cubic-bezier(.18, .82, .2, 1);
      --ease-spring: cubic-bezier(.16, 1.18, .3, 1);
      --header-height: 82px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
      background: var(--ink-950);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 111, 63, 0.12), transparent 27rem),
        radial-gradient(circle at 92% 14%, rgba(107, 215, 178, 0.11), transparent 31rem),
        radial-gradient(circle at 48% 80%, rgba(201, 255, 90, 0.07), transparent 34rem),
        linear-gradient(180deg, #080907 0%, #0c0f0b 54%, #080907 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        linear-gradient(rgba(233, 229, 214, 0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(233, 229, 214, 0.024) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
      animation: grid-drift linear both;
      animation-timeline: scroll(root block);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: 0.84;
      background:
        radial-gradient(circle at center, transparent 32%, rgba(0, 0, 0, 0.52) 100%),
        linear-gradient(112deg, transparent 36%, rgba(201, 255, 90, 0.018) 48%, transparent 62%);
    }

    ::selection {
      color: var(--ink-950);
      background: var(--lichen-300);
    }

    h1,
    h2,
    h3,
    .brand-name,
    .button {
      font-family: "Bricolage Grotesque", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page-shell {
      width: min(calc(100% - 36px), var(--max));
      margin-inline: auto;
    }

    .scroll-progress {
      position: fixed;
      inset: 0 auto auto 0;
      z-index: 90;
      width: 100%;
      height: 3px;
      pointer-events: none;
      transform: scaleX(0);
      transform-origin: left;
      background:
        linear-gradient(
          90deg,
          var(--ember-400),
          var(--saffron-300) 36%,
          var(--lichen-300) 64%,
          var(--verdigris-300)
        );
      box-shadow: 0 0 22px rgba(201, 255, 90, 0.35);
      animation: scroll-progress linear both;
      animation-timeline: scroll(root block);
    }

    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 60;
      padding-top: max(12px, env(safe-area-inset-top));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 66px;
      padding: 11px 12px 11px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(8, 9, 7, 0.72);
      box-shadow:
        0 14px 45px rgba(0, 0, 0, 0.24),
        0 1px 0 rgba(255, 255, 255, 0.04) inset;
      backdrop-filter: blur(24px) saturate(115%);
      transform-origin: top center;
      animation: topbar-compress linear both;
      animation-timeline: scroll(root block);
      animation-range: 0 360px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgba(201, 255, 90, 0.32);
      border-radius: 14px 14px 14px 7px;
      color: var(--ink-950);
      background:
        linear-gradient(145deg, var(--lichen-300), var(--saffron-300) 56%, var(--ember-300));
      box-shadow:
        0 14px 32px rgba(201, 255, 90, 0.12),
        0 1px 0 rgba(255, 255, 255, 0.62) inset;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--ink-950);
    }

    .brand-mark::before {
      top: -7px;
      left: 14px;
    }

    .brand-mark::after {
      top: 14px;
      right: -7px;
    }

    .brand-symbol {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.08em;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 15px;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    .brand-version {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link {
      position: relative;
      padding: 9px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
      transition:
        color 180ms ease,
        background 180ms ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      right: 12px;
      bottom: 5px;
      left: 12px;
      height: 1px;
      transform: scaleX(0);
      transform-origin: left;
      background: var(--lichen-300);
      transition: transform 220ms var(--ease-out);
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(233, 229, 214, 0.045);
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    .button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 47px;
      padding: 0 18px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 720;
      letter-spacing: -0.02em;
      transition:
        transform 220ms var(--ease-out),
        border-color 220ms ease,
        box-shadow 220ms ease,
        background 220ms ease;
    }

    .button::after {
      content: "";
      position: absolute;
      inset: -40% -20%;
      pointer-events: none;
      transform: translateX(-70%) rotate(12deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      transition: transform 620ms var(--ease-out);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button:hover::after {
      transform: translateX(70%) rotate(12deg);
    }

    .button-primary {
      color: #0b0d09;
      background:
        linear-gradient(120deg, var(--lichen-300), var(--saffron-300) 58%, var(--ember-300));
      box-shadow:
        0 14px 34px rgba(201, 255, 90, 0.12),
        0 1px 0 rgba(255, 255, 255, 0.65) inset;
    }

    .button-primary:hover {
      box-shadow:
        0 18px 46px rgba(255, 143, 100, 0.16),
        0 0 0 1px rgba(201, 255, 90, 0.22) inset;
    }

    .button-secondary {
      color: var(--bone-100);
      border-color: rgba(233, 229, 214, 0.14);
      background: rgba(233, 229, 214, 0.035);
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(430px, 0.94fr);
      align-items: center;
      gap: clamp(36px, 5vw, 74px);
      min-height: calc(100svh - 84px);
      padding: clamp(76px, 10vw, 126px) 0 104px;
      view-timeline-name: --hero-flow;
      view-timeline-axis: block;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 4%;
      right: -12%;
      width: 46rem;
      height: 46rem;
      border: 1px solid rgba(107, 215, 178, 0.08);
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle,
          transparent 0 54px,
          rgba(107, 215, 178, 0.035) 55px 56px
        );
      animation: halo-turn linear both;
      animation-timeline: --hero-flow;
      animation-range: entry 0% exit 100%;
    }

    .hero-copy {
      position: relative;
      z-index: 4;
      animation: hero-copy-drift linear both;
      animation-timeline: --hero-flow;
      animation-range: entry 0% exit 95%;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      padding: 8px 12px;
      border: 1px solid rgba(201, 255, 90, 0.18);
      border-radius: 999px;
      color: var(--bone-300);
      background: rgba(201, 255, 90, 0.035);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lichen-300);
      box-shadow: 0 0 18px rgba(201, 255, 90, 0.62);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .hero-title {
      max-width: 780px;
      margin: 0;
      font-size: clamp(54px, 7.4vw, 100px);
      font-weight: 790;
      line-height: 0.88;
      letter-spacing: -0.075em;
      text-wrap: balance;
    }

    .hero-title .accent {
      display: block;
      color: transparent;
      background:
        linear-gradient(
          100deg,
          var(--bone-50) 0%,
          var(--saffron-300) 30%,
          var(--ember-300) 58%,
          var(--lichen-300) 90%
        );
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 34px rgba(255, 143, 100, 0.09));
    }

    .hero-description {
      max-width: 690px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.62;
      letter-spacing: -0.015em;
      text-wrap: pretty;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .hero-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .metric {
      min-width: 116px;
    }

    .metric-value {
      margin: 0;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 24px;
      font-weight: 760;
      letter-spacing: -0.045em;
    }

    .metric-label {
      margin: 5px 0 0;
      color: var(--bone-500);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .puzzle-scene {
      position: relative;
      min-height: 610px;
      perspective: 1200px;
      isolation: isolate;
      touch-action: pan-y;
    }

    .scene-orbit {
      position: absolute;
      inset: 8% 2% 5%;
      z-index: -2;
      border: 1px solid rgba(233, 229, 214, 0.08);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    .scene-orbit::before,
    .scene-orbit::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      border: inherit;
    }

    .scene-orbit::before {
      inset: 11%;
    }

    .scene-orbit::after {
      inset: 24%;
    }

    .scene-label {
      position: absolute;
      z-index: 6;
      right: 3%;
      bottom: 5%;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--bone-500);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transform: rotate(90deg);
      transform-origin: right bottom;
    }

    .scene-label::before {
      content: "";
      width: 42px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ember-300));
    }

    .puzzle-board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: min(100%, 520px);
      margin: 26px auto 0;
      padding: 16px;
      transform: rotate(-3deg) translateZ(0);
      transform-style: preserve-3d;
    }

    .piece-orbit {
      position: relative;
      min-width: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .piece-orbit:nth-child(1) {
      z-index: 4;
    }

    .piece-orbit:nth-child(2) {
      z-index: 3;
    }

    .piece-orbit:nth-child(3) {
      z-index: 2;
    }

    .piece-orbit:nth-child(4) {
      z-index: 1;
    }

    .puzzle-piece {
      --from-x: 0px;
      --from-y: 0px;
      --from-r: 0deg;
      --exit-x: 0px;
      --exit-y: 0px;
      --exit-r: 0deg;
      --piece-accent: var(--lichen-300);

      position: relative;
      min-height: 242px;
      padding: 25px;
      overflow: visible;
      border: 1px solid rgba(233, 229, 214, 0.13);
      color: var(--bone-50);
      background:
        radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--piece-accent) 12%, transparent), transparent 34%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.048), rgba(255, 255, 255, 0.008)),
        var(--panel-solid);
      box-shadow:
        var(--shadow),
        0 0 0 1px rgba(0, 0, 0, 0.24) inset;
      transform-origin: center;
      will-change: transform, opacity, filter;
      animation: puzzle-dock linear both;
      animation-timeline: --hero-flow;
      animation-range: entry 0% exit 100%;
    }

    .puzzle-piece::before,
    .puzzle-piece::after {
      content: "";
      position: absolute;
      z-index: 2;
      width: 46px;
      height: 46px;
      border: inherit;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--piece-accent) 14%, transparent), transparent 56%),
        var(--panel-solid);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .piece-a {
      --piece-accent: var(--lichen-300);
      --from-x: -250px;
      --from-y: -160px;
      --from-r: -28deg;
      --exit-x: -70px;
      --exit-y: -40px;
      --exit-r: -6deg;
      border-radius: 30px 12px 8px 12px;
    }

    .piece-a::before {
      right: -24px;
      top: calc(50% - 23px);
    }

    .piece-a::after {
      bottom: -24px;
      left: calc(50% - 23px);
    }

    .piece-b {
      --piece-accent: var(--ember-300);
      --from-x: 260px;
      --from-y: -110px;
      --from-r: 31deg;
      --exit-x: 60px;
      --exit-y: -55px;
      --exit-r: 8deg;
      border-radius: 12px 30px 12px 8px;
    }

    .piece-b::before {
      right: -24px;
      top: 54px;
      background: var(--ink-950);
      box-shadow:
        0 0 0 1px rgba(233, 229, 214, 0.08) inset,
        0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .piece-b::after {
      bottom: -24px;
      left: calc(50% - 23px);
    }

    .piece-c {
      --piece-accent: var(--verdigris-300);
      --from-x: -230px;
      --from-y: 180px;
      --from-r: 24deg;
      --exit-x: -52px;
      --exit-y: 52px;
      --exit-r: 7deg;
      border-radius: 12px 8px 12px 30px;
    }

    .piece-c::before {
      right: -24px;
      top: calc(50% - 23px);
    }

    .piece-c::after {
      bottom: 50px;
      left: -24px;
      background: var(--ink-950);
      box-shadow:
        0 0 0 1px rgba(233, 229, 214, 0.08) inset,
        0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .piece-d {
      --piece-accent: var(--saffron-300);
      --from-x: 245px;
      --from-y: 160px;
      --from-r: -26deg;
      --exit-x: 65px;
      --exit-y: 56px;
      --exit-r: -7deg;
      border-radius: 8px 12px 30px 12px;
    }

    .piece-d::before {
      right: 56px;
      bottom: -24px;
      background: var(--ink-950);
      box-shadow:
        0 0 0 1px rgba(233, 229, 214, 0.08) inset,
        0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .piece-d::after {
      top: 50px;
      left: -24px;
      background: var(--ink-950);
      box-shadow:
        0 0 0 1px rgba(233, 229, 214, 0.08) inset,
        0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .piece-kicker {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--bone-500);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .piece-index {
      color: var(--piece-accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-weight: 800;
    }

    .puzzle-piece h3 {
      position: relative;
      z-index: 4;
      margin: 44px 0 0;
      font-size: 29px;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .puzzle-piece p {
      position: relative;
      z-index: 4;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.58;
    }

    .piece-code {
      position: relative;
      z-index: 4;
      display: inline-flex;
      max-width: 100%;
      margin-top: 19px;
      padding: 8px 10px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--piece-accent) 18%, transparent);
      border-radius: 9px;
      color: color-mix(in srgb, var(--piece-accent) 74%, white);
      background: color-mix(in srgb, var(--piece-accent) 6%, transparent);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section {
      position: relative;
      padding: 110px 0;
    }

    .section-heading {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
      align-items: end;
      gap: 62px;
      margin-bottom: 48px;
    }

    .section-label {
      color: var(--lichen-300);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .section-title {
      max-width: 740px;
      margin: 12px 0 0;
      font-size: clamp(40px, 5.4vw, 70px);
      line-height: 0.94;
      letter-spacing: -0.065em;
      text-wrap: balance;
    }

    .section-copy {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      text-wrap: pretty;
    }

    .assembly-line {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      padding: 34px 0 46px;
      view-timeline-name: --assembly-flow;
      view-timeline-axis: block;
    }

    .assembly-line::before {
      content: "";
      position: absolute;
      top: 50%;
      right: -12vw;
      left: -12vw;
      height: 1px;
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 111, 63, 0.52) 18%,
          rgba(255, 211, 105, 0.52) 42%,
          rgba(201, 255, 90, 0.52) 66%,
          rgba(107, 215, 178, 0.52) 82%,
          transparent
        );
      transform: scaleX(0);
      transform-origin: center;
      animation: rail-grow linear both;
      animation-timeline: --assembly-flow;
      animation-range: entry 8% cover 54%;
    }

    .module-card {
      --offset-x: 0px;
      --offset-y: 0px;
      --module-accent: var(--lichen-300);

      position: relative;
      z-index: 2;
      min-height: 330px;
      padding: 25px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--module-accent) 10%, transparent), transparent 34%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.008)),
        rgba(15, 18, 13, 0.88);
      box-shadow: var(--shadow);
      will-change: transform, opacity, filter;
      animation: module-lock linear both;
      animation-timeline: --assembly-flow;
      animation-range: entry 0% cover 64%;
    }

    .module-card:nth-child(1) {
      --offset-x: -34vw;
      --offset-y: 90px;
      --module-accent: var(--ember-300);
      border-radius: 28px 8px 8px 28px;
    }

    .module-card:nth-child(2) {
      --offset-x: -12vw;
      --offset-y: -86px;
      --module-accent: var(--saffron-300);
      border-radius: 8px;
    }

    .module-card:nth-child(3) {
      --offset-x: 12vw;
      --offset-y: 96px;
      --module-accent: var(--lichen-300);
      border-radius: 8px;
    }

    .module-card:nth-child(4) {
      --offset-x: 34vw;
      --offset-y: -76px;
      --module-accent: var(--verdigris-300);
      border-radius: 8px 28px 28px 8px;
    }

    .module-card::before,
    .module-card::after {
      content: "";
      position: absolute;
      z-index: 2;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--ink-950);
    }

    .module-card:nth-child(1)::before,
    .module-card:nth-child(2)::before,
    .module-card:nth-child(3)::before {
      top: calc(50% - 21px);
      right: -21px;
      background:
        radial-gradient(circle at 28% 22%, color-mix(in srgb, var(--module-accent) 16%, transparent), transparent 55%),
        var(--panel-solid);
    }

    .module-card:nth-child(2)::after,
    .module-card:nth-child(3)::after,
    .module-card:nth-child(4)::after {
      top: calc(50% - 21px);
      left: -21px;
    }

    .module-index {
      color: var(--module-accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.13em;
    }

    .module-card h3 {
      margin: 70px 0 0;
      font-size: 27px;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .module-card p {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .module-code {
      display: inline-flex;
      margin-top: 22px;
      padding: 8px 10px;
      border: 1px solid color-mix(in srgb, var(--module-accent) 18%, transparent);
      border-radius: 9px;
      color: color-mix(in srgb, var(--module-accent) 70%, white);
      background: color-mix(in srgb, var(--module-accent) 5%, transparent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
    }

    .feature-card {
      --card-accent: var(--lichen-300);

      position: relative;
      min-height: 270px;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 100% 100%, color-mix(in srgb, var(--card-accent) 10%, transparent), transparent 32%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.036), rgba(255, 255, 255, 0.006)),
        rgba(13, 16, 12, 0.82);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.035) inset,
        0 26px 70px rgba(0, 0, 0, 0.24);
      transition:
        transform 320ms var(--ease-out),
        border-color 320ms ease;
    }

    .feature-card:nth-child(2n) {
      --card-accent: var(--ember-300);
    }

    .feature-card:nth-child(3n) {
      --card-accent: var(--verdigris-300);
    }

    .feature-card:hover {
      transform: translateY(-7px) rotate(-0.4deg);
      border-color: color-mix(in srgb, var(--card-accent) 42%, transparent);
    }

    .feature-card.wide {
      grid-column: span 7;
    }

    .feature-card.narrow {
      grid-column: span 5;
    }

    .feature-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid color-mix(in srgb, var(--card-accent) 22%, transparent);
      border-radius: 14px 14px 14px 7px;
      color: var(--card-accent);
      background: color-mix(in srgb, var(--card-accent) 6%, transparent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-weight: 800;
    }

    .feature-card h3 {
      max-width: 560px;
      margin: 50px 0 0;
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .feature-card p {
      max-width: 620px;
      margin: 13px 0 0;
      color: var(--muted);
      line-height: 1.66;
    }

    .code-section {
      padding-top: 60px;
    }

    .code-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      align-items: stretch;
    }

    .code-shell {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(201, 255, 90, 0.16);
      border-radius: 26px;
      background: rgba(10, 12, 9, 0.94);
      box-shadow: var(--shadow);
    }

    .code-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(233, 229, 214, 0.018);
    }

    .code-dots {
      display: flex;
      gap: 7px;
    }

    .code-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bone-500);
    }

    .code-dot:nth-child(1) { background: var(--ember-300); }
    .code-dot:nth-child(2) { background: var(--saffron-300); }
    .code-dot:nth-child(3) { background: var(--lichen-300); }

    .code-label {
      color: var(--bone-500);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .copy-button {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--bone-300);
      background: rgba(233, 229, 214, 0.03);
      cursor: pointer;
      font-size: 11px;
    }

    pre {
      margin: 0;
      overflow-x: auto;
      padding: 30px;
      color: var(--bone-100);
      font: 13px/1.82 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    .token-key { color: var(--saffron-300); }
    .token-fn { color: var(--lichen-300); }
    .token-string { color: var(--verdigris-300); }
    .token-comment { color: #6d7364; }
    .token-prop { color: var(--ember-300); }

    .code-map {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(15, 18, 13, 0.82);
      box-shadow: var(--shadow);
    }

    .code-map-item {
      position: relative;
      min-height: 112px;
      padding: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(233, 229, 214, 0.025);
    }

    .code-map-item::after {
      content: "";
      position: absolute;
      right: -16px;
      bottom: -16px;
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--ink-950);
    }

    .code-map-item strong {
      display: block;
      color: var(--lichen-300);
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 18px;
    }

    .code-map-item span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.48;
    }

    .architecture-stage {
      position: relative;
      min-height: 680px;
      view-timeline-name: --architecture-flow;
      view-timeline-axis: block;
    }

    .architecture-core {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 190px;
      aspect-ratio: 1;
      padding: 24px;
      border: 1px solid rgba(201, 255, 90, 0.26);
      border-radius: 35% 45% 40% 48%;
      text-align: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(201, 255, 90, 0.18), transparent 44%),
        var(--panel-solid);
      box-shadow:
        0 0 80px rgba(201, 255, 90, 0.08),
        var(--shadow);
      transform: translate(-50%, -50%);
      animation: core-breathe linear both;
      animation-timeline: --architecture-flow;
      animation-range: entry 8% exit 92%;
    }

    .architecture-core strong {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 24px;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .architecture-core span {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .architecture-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 520px;
      height: 520px;
      border: 1px dashed rgba(233, 229, 214, 0.12);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ring-turn linear both;
      animation-timeline: --architecture-flow;
      animation-range: entry 0% exit 100%;
    }

    .architecture-card {
      --orbit-x: 0px;
      --orbit-y: 0px;
      --from-x: 0px;
      --from-y: 0px;
      --arch-accent: var(--lichen-300);

      position: absolute;
      z-index: 4;
      width: min(320px, 42vw);
      min-height: 180px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--arch-accent) 10%, transparent), transparent 34%),
        rgba(15, 18, 13, 0.92);
      box-shadow: var(--shadow);
      animation: architecture-lock linear both;
      animation-timeline: --architecture-flow;
      animation-range: entry 4% cover 66%;
    }

    .architecture-card:nth-of-type(1) {
      --orbit-x: 2%;
      --orbit-y: 8%;
      --from-x: -280px;
      --from-y: -180px;
      --arch-accent: var(--ember-300);
      top: 4%;
      left: 2%;
    }

    .architecture-card:nth-of-type(2) {
      --orbit-x: 68%;
      --orbit-y: 10%;
      --from-x: 290px;
      --from-y: -160px;
      --arch-accent: var(--saffron-300);
      top: 8%;
      right: 0;
    }

    .architecture-card:nth-of-type(3) {
      --orbit-x: 0%;
      --orbit-y: 68%;
      --from-x: -260px;
      --from-y: 180px;
      --arch-accent: var(--verdigris-300);
      bottom: 3%;
      left: 4%;
    }

    .architecture-card:nth-of-type(4) {
      --orbit-x: 66%;
      --orbit-y: 72%;
      --from-x: 290px;
      --from-y: 180px;
      --arch-accent: var(--lichen-300);
      right: 2%;
      bottom: 1%;
    }

    .architecture-card small {
      color: var(--arch-accent);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .architecture-card h3 {
      margin: 33px 0 0;
      font-size: 25px;
      letter-spacing: -0.045em;
    }

    .architecture-card p {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.58;
    }

    .cta {
      position: relative;
      margin: 82px 0 32px;
      padding: clamp(34px, 6vw, 66px);
      overflow: hidden;
      border: 1px solid rgba(201, 255, 90, 0.2);
      border-radius: 34px;
      background:
        radial-gradient(circle at 0 0, rgba(255, 111, 63, 0.14), transparent 34%),
        radial-gradient(circle at 100% 100%, rgba(107, 215, 178, 0.14), transparent 36%),
        rgba(14, 17, 12, 0.9);
      box-shadow: var(--shadow);
      view-timeline-name: --cta-flow;
      view-timeline-axis: block;
    }

    .cta::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          118deg,
          transparent 0 46px,
          rgba(233, 229, 214, 0.026) 47px 48px
        );
      transform: translateX(-20%);
      animation: cta-texture linear both;
      animation-timeline: --cta-flow;
      animation-range: entry 0% exit 100%;
    }

    .cta-grid {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 38px;
    }

    .cta h2 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(42px, 5.6vw, 72px);
      line-height: 0.92;
      letter-spacing: -0.07em;
      text-wrap: balance;
    }

    .cta p {
      max-width: 680px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.66;
    }

    .cta-pieces {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .cta-piece {
      position: absolute;
      width: 118px;
      height: 118px;
      border: 1px solid var(--line);
      border-radius: 26px;
      opacity: 0.42;
      background: rgba(233, 229, 214, 0.025);
      animation: cta-piece-lock linear both;
      animation-timeline: --cta-flow;
      animation-range: entry 0% cover 68%;
    }

    .cta-piece:nth-child(1) {
      top: -30px;
      right: 26%;
      --cta-x: -180px;
      --cta-y: -80px;
      --cta-r: -24deg;
    }

    .cta-piece:nth-child(2) {
      right: 9%;
      bottom: -54px;
      --cta-x: 150px;
      --cta-y: 130px;
      --cta-r: 28deg;
    }

    .cta-piece:nth-child(3) {
      top: 30%;
      left: -42px;
      --cta-x: -160px;
      --cta-y: 40px;
      --cta-r: -18deg;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 34px 0 calc(44px + env(safe-area-inset-bottom));
      color: var(--bone-500);
      font-size: 12px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
    }

    .footer a:hover {
      color: var(--lichen-300);
    }

    .wa-reveal {
      opacity: 0;
      transform: translateY(24px);
    }

    .no-scroll-timeline .puzzle-piece,
    .no-scroll-timeline .module-card,
    .no-scroll-timeline .architecture-card,
    .no-scroll-timeline .architecture-core,
    .no-scroll-timeline .cta-piece {
      animation: none;
    }

    .no-scroll-timeline .puzzle-piece {
      opacity: 1;
      transform: none;
      filter: none;
    }

    @keyframes scroll-progress {
      to { transform: scaleX(1); }
    }

    @keyframes grid-drift {
      to { background-position: 0 120px, 120px 0; }
    }

    @keyframes topbar-compress {
      from {
        transform: scale(1);
        border-radius: 22px;
      }
      to {
        transform: scale(0.975);
        border-radius: 18px;
        background: rgba(8, 9, 7, 0.88);
      }
    }

    @keyframes halo-turn {
      from { transform: rotate(0deg) scale(0.86); opacity: 0; }
      34% { opacity: 1; }
      to { transform: rotate(70deg) scale(1.1); opacity: 0.3; }
    }

    @keyframes hero-copy-drift {
      from { transform: translateY(36px); opacity: 0; }
      24% { transform: none; opacity: 1; }
      68% { transform: none; opacity: 1; }
      to { transform: translateY(-70px) scale(0.97); opacity: 0.28; }
    }

    @keyframes puzzle-dock {
      0% {
        opacity: 0;
        filter: blur(18px) saturate(0.55);
        transform:
          translate3d(var(--from-x), var(--from-y), -180px)
          rotate(var(--from-r))
          scale(0.68);
      }
      22% {
        opacity: 1;
        filter: blur(3px) saturate(0.9);
      }
      38%,
      70% {
        opacity: 1;
        filter: none;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0.28;
        filter: blur(4px);
        transform:
          translate3d(var(--exit-x), var(--exit-y), -80px)
          rotate(var(--exit-r))
          scale(0.92);
      }
    }

    @keyframes rail-grow {
      to { transform: scaleX(1); }
    }

    @keyframes module-lock {
      from {
        opacity: 0;
        filter: blur(14px);
        transform: translate3d(var(--offset-x), var(--offset-y), -160px) rotate(8deg) scale(0.72);
      }
      72% {
        opacity: 1;
        filter: blur(1px);
      }
      to {
        opacity: 1;
        filter: none;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
    }

    @keyframes ring-turn {
      from { transform: translate(-50%, -50%) rotate(0deg) scale(0.7); opacity: 0; }
      35% { opacity: 1; }
      to { transform: translate(-50%, -50%) rotate(100deg) scale(1.08); opacity: 0.42; }
    }

    @keyframes core-breathe {
      from { transform: translate(-50%, -50%) scale(0.72) rotate(-8deg); opacity: 0; }
      35% { opacity: 1; }
      60% { transform: translate(-50%, -50%) scale(1.04) rotate(2deg); opacity: 1; }
      to { transform: translate(-50%, -50%) scale(0.96) rotate(0deg); opacity: 0.58; }
    }

    @keyframes architecture-lock {
      from {
        opacity: 0;
        filter: blur(14px);
        transform: translate3d(var(--from-x), var(--from-y), -100px) rotate(12deg) scale(0.72);
      }
      to {
        opacity: 1;
        filter: none;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
    }

    @keyframes cta-texture {
      to { transform: translateX(20%); }
    }

    @keyframes cta-piece-lock {
      from {
        opacity: 0;
        transform: translate3d(var(--cta-x), var(--cta-y), 0) rotate(var(--cta-r)) scale(0.62);
      }
      to {
        opacity: 0.42;
        transform: none;
      }
    }

    @keyframes pulse {
      50% {
        transform: scale(1.35);
        box-shadow: 0 0 26px rgba(201, 255, 90, 0.82);
      }
    }

    @media (max-width: 1040px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .puzzle-scene {
        min-height: 610px;
      }

      .assembly-line {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .module-card:nth-child(n) {
        border-radius: 22px;
      }

      .module-card::before,
      .module-card::after {
        display: none;
      }

      .code-layout {
        grid-template-columns: 1fr;
      }

      .code-map {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .nav {
        display: none;
      }

      .section-heading {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .feature-card.wide,
      .feature-card.narrow {
        grid-column: span 12;
      }

      .architecture-stage {
        display: grid;
        gap: 14px;
        min-height: 0;
      }

      .architecture-ring,
      .architecture-core {
        display: none;
      }

      .architecture-card {
        position: relative;
        inset: auto !important;
        width: 100%;
      }

      .cta-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page-shell {
        width: min(calc(100% - 20px), var(--max));
      }

      .topbar {
        min-height: 60px;
        padding: 9px 9px 9px 12px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .brand-version {
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar .button {
        min-height: 40px;
        padding: 0 12px;
        font-size: 12px;
      }

      .hero {
        padding: 72px 0 72px;
      }

      .hero-title {
        font-size: clamp(50px, 16vw, 74px);
      }

      .hero-description {
        font-size: 16px;
      }

      .puzzle-scene {
        min-height: 760px;
      }

      .puzzle-board {
        grid-template-columns: 1fr;
        gap: 12px;
        width: 100%;
        padding: 0;
        transform: none;
      }

      .puzzle-piece {
        min-height: 170px;
        border-radius: 22px;
      }

      .puzzle-piece::before,
      .puzzle-piece::after {
        display: none;
      }

      .puzzle-piece h3 {
        margin-top: 26px;
      }

      .scene-orbit,
      .scene-label {
        display: none;
      }

      .section {
        padding: 78px 0;
      }

      .assembly-line {
        grid-template-columns: 1fr;
      }

      .assembly-line::before {
        display: none;
      }

      .module-card {
        min-height: 250px;
        border-radius: 22px;
      }

      .module-card h3 {
        margin-top: 46px;
      }

      .code-map {
        grid-template-columns: 1fr;
      }

      pre {
        padding: 22px;
        font-size: 11px;
      }

      .cta {
        padding: 34px 24px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      .wa-reveal {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>

<body>

      function setupWAAPIReveals() {
        const nodes = [...document.querySelectorAll(".wa-reveal")];

        if (reduceMotion) {
          nodes.forEach((node) => {
            node.style.opacity = "1";
            node.style.transform = "none";
          });
          return;
        }

        const observer = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;

              const node = entry.target;
              const siblings = [...(node.parentElement?.children ?? [])];
              const siblingIndex = Math.max(0, siblings.indexOf(node));

              node.animate(
                [
                  {
                    opacity: 0,
                    transform: "translate3d(0, 34px, 0) scale(.985)",
                    filter: "blur(8px)",
                  },
                  {
                    opacity: 1,
                    transform: "translate3d(0, 0, 0) scale(1)",
                    filter: "blur(0)",
                  },
                ],
                {
                  duration: 760,
                  delay: Math.min(siblingIndex * 70, 280),
                  easing: "cubic-bezier(.18,.82,.2,1)",
                  fill: "forwards",
                },
              );

              observer.unobserve(node);
            }
          },
          {
            threshold: 0.16,
            rootMargin: "0px 0px -8% 0px",
          },
        );

        nodes.forEach((node) => observer.observe(node));
      }

      function setupPuzzleKinetics() {
        if (reduceMotion || !matchMedia("(pointer: fine)").matches) return;

        const scene = document.querySelector(".puzzle-scene");
        const orbits = [...document.querySelectorAll(".piece-orbit")];

        if (!scene || !orbits.length) return;

        let frame = 0;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        const render = () => {
          frame = 0;
          currentX += (targetX - currentX) * 0.11;
          currentY += (targetY - currentY) * 0.11;

          orbits.forEach((orbit, index) => {
            const depth = Number(orbit.dataset.depth || index + 1);
            const distance = 4 + depth * 3.6;
            const rotation = currentX * (0.7 + depth * 0.16);

            orbit.style.transform = `
              translate3d(
                ${currentX * distance}px,
                ${currentY * distance}px,
                ${depth * 4}px
              )
              rotate(${rotation}deg)
            `;
          });

          if (
            Math.abs(targetX - currentX) > 0.001 ||
            Math.abs(targetY - currentY) > 0.001
          ) {
            frame = requestAnimationFrame(render);
          }
        };

        const requestRender = () => {
          if (!frame) frame = requestAnimationFrame(render);
        };

        scene.addEventListener(
          "pointermove",
          (event) => {
            const rect = scene.getBoundingClientRect();
            targetX = (event.clientX - rect.left) / rect.width - 0.5;
            targetY = (event.clientY - rect.top) / rect.height - 0.5;
            requestRender();
          },
          { passive: true },
        );

        scene.addEventListener(
          "pointerleave",
          () => {
            targetX = 0;
            targetY = 0;
            requestRender();

            orbits.forEach((orbit, index) => {
              orbit.animate(
                [
                  { filter: "brightness(1.08)" },
                  { filter: "brightness(1)" },
                ],
                {
                  duration: 540 + index * 55,
                  easing: "cubic-bezier(.16,1,.3,1)",
                },
              );
            });
          },
          { passive: true },
        );
      }

      function setupMagneticButtons() {
        if (reduceMotion || !matchMedia("(pointer: fine)").matches) return;

        document.querySelectorAll(".button").forEach((button) => {
          button.addEventListener(
            "pointermove",
            (event) => {
              const rect = button.getBoundingClientRect();
              const x = ((event.clientX - rect.left) / rect.width - 0.5) * 8;
              const y = ((event.clientY - rect.top) / rect.height - 0.5) * 6;

              button.animate(
                [
                  {
                    transform: `translate3d(${x}px, ${y - 2}px, 0)`,
                  },
                ],
                {
                  duration: 260,
                  easing: "cubic-bezier(.18,.82,.2,1)",
                  fill: "forwards",
                },
              );
            },
            { passive: true },
          );

          button.addEventListener(
            "pointerleave",
            () => {
              button.animate(
                [{ transform: "translate3d(0, 0, 0)" }],
                {
                  duration: 420,
                  easing: "cubic-bezier(.16,1,.3,1)",
                  fill: "forwards",
                },
              );
            },
            { passive: true },
          );
        });
      }

      function setupFallbackAssemblies() {
        if (supportsScrollTimeline || reduceMotion) return;

        const targets = [
          ...document.querySelectorAll(
            ".module-card, .architecture-card, .architecture-core, .cta-piece",
          ),
        ];

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;

              entry.target.animate(
                [
                  {
                    opacity: 0,
                    transform: "translate3d(0, 46px, 0) scale(.92)",
                    filter: "blur(10px)",
                  },
                  {
                    opacity: 1,
                    transform: "none",
                    filter: "none",
                  },
                ],
                {
                  duration: 820,
                  easing: "cubic-bezier(.16,1,.3,1)",
                  fill: "forwards",
                },
              );

              observer.unobserve(entry.target);
            });
          },
          { threshold: 0.16 },
        );

        targets.forEach((target) => observer.observe(target));
      }

      setupWAAPIReveals();
      setupPuzzleKinetics();
      setupMagneticButtons();
      setupFallbackAssemblies();
    })();
