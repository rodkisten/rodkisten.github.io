<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  >
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <title>Previewer</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #0d1117;
      --surface: rgba(22, 27, 34, 0.96);
      --surface-raised: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --danger: #f85149;
      --success: #3fb950;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family:
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    select {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-raised);
      color: var(--text);
      font: inherit;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 11px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
      transform: none;
    }

    select {
      max-width: 140px;
      padding: 6px 28px 6px 10px;
    }

    code {
      font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        Menlo,
        Consolas,
        monospace;
    }

    #app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100dvh;
      min-height: 100%;
      padding:
        var(--safe-top)
        var(--safe-right)
        var(--safe-bottom)
        var(--safe-left);
    }

    #toolbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      scrollbar-width: none;
    }

    #toolbar::-webkit-scrollbar {
      display: none;
    }

    #toolbar .spacer {
      flex: 1 0 12px;
    }

    #filename {
      flex: 0 1 240px;
      min-width: 80px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #editorHost {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--background);
    }

    #fallbackEditor {
      width: 100%;
      height: 100%;
      margin: 0;
      padding:
        14px
        14px
        max(24px, var(--safe-bottom));
      resize: none;
      overflow: auto;
      border: 0;
      outline: 0;
      background: var(--background);
      color: var(--text);
      caret-color: #58a6ff;
      font:
        14px/1.55
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        Menlo,
        Consolas,
        monospace;
      tab-size: 2;
      white-space: pre;
      overflow-wrap: normal;
      -webkit-overflow-scrolling: touch;
    }

    #empty {
      position: absolute;
      inset: 50% auto auto 50%;
      z-index: 2;
      width: min(86vw, 440px);
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(22, 27, 34, 0.94);
      color: var(--muted);
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 15px;
    }

    #statusbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 28px;
      padding: 5px 10px;
      overflow: hidden;
      border-top: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    #status {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #statusbar .spacer {
      flex: 1;
    }

    #fileInput {
      display: none;
    }

    .cm-editor {
      height: 100%;
      background: var(--background);
      font-size: 14px;
    }

    .cm-editor.cm-focused {
      outline: none;
    }

    .cm-scroller {
      overflow: auto;
      overscroll-behavior: contain;
      font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        Menlo,
        Consolas,
        monospace;
      line-height: 1.55;
      -webkit-overflow-scrolling: touch;
    }

    .cm-content {
      min-height: 100%;
      padding: 10px 0 max(20px, var(--safe-bottom));
      caret-color: #58a6ff;
    }

    .cm-gutters {
      border-right: 1px solid var(--border) !important;
      background: #0d1117 !important;
      color: #6e7681 !important;
    }

    .cm-activeLine,
    .cm-activeLineGutter {
      background: rgba(110, 118, 129, 0.12) !important;
    }

    .cm-foldGutter span {
      color: var(--muted);
    }

    .cm-foldPlaceholder {
      border: 1px solid var(--border) !important;
      border-radius: 5px !important;
      background: var(--surface-raised) !important;
      color: var(--muted) !important;
    }

    @media (max-width: 560px) {
      #toolbar {
        gap: 6px;
        padding: 7px;
      }

      button,
      select {
        min-height: 34px;
        font-size: 12px;
      }

      button {
        padding-inline: 9px;
      }

      #filename {
        display: none;
      }

      .cm-editor,
      #fallbackEditor {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <header id="toolbar" aria-label="Ferramentas do editor">
      <button id="openButton" type="button" title="Abrir arquivo">
        Abrir
      </button>

      <button
        id="pasteButton"
        type="button"
        title="Colar da área de transferência"
      >
        Colar
      </button>

      <select id="language" aria-label="Linguagem">
        <option value="auto">Auto</option>
        <option value="json">JSON</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="text">Texto</option>
      </select>

      <button id="formatButton" type="button" title="Formatar conteúdo">
        Formatar
      </button>

      <button id="foldButton" type="button" title="Recolher tudo">
        Fold
      </button>

      <button id="unfoldButton" type="button" title="Expandir tudo">
        Unfold
      </button>

      <button id="copyButton" type="button" title="Copiar conteúdo">
        Copiar
      </button>

      <span class="spacer"></span>
      <span id="filename">Previewer</span>
    </header>

    <section id="editorHost" aria-label="Editor de código">
      <textarea
        id="fallbackEditor"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        aria-label="Editor de texto"
      ></textarea>

      <div id="empty">
        <strong>Nenhum conteúdo recebido</strong>
        Use <code>?code=...</code>, <code>?content=...</code>, hash,
        área de transferência ou abra um arquivo.
      </div>
    </section>

    <footer id="statusbar">
      <span id="status">Inicializando</span>
      <span class="spacer"></span>
      <span id="position">Ln 1, Col 1</span>
      <span id="size">0 B</span>
    </footer>
  </main>

  <input
    id="fileInput"
    type="file"
    accept=".json,.html,.htm,.css,.txt,text/plain,text/html,text/css,application/json"
  >

  <script>
    (() => {
      "use strict";

      const state = {
        view: null,
        currentLanguage: "text",
        currentFilename: "Previewer",
        codeMirrorReady: false,
        codeMirrorApi: null,
      };

      const editorHost = document.querySelector("#editorHost");
      const fallbackEditor = document.querySelector("#fallbackEditor");
      const emptyElement = document.querySelector("#empty");
      const languageSelect = document.querySelector("#language");
      const filenameElement = document.querySelector("#filename");
      const statusElement = document.querySelector("#status");
      const positionElement = document.querySelector("#position");
      const sizeElement = document.querySelector("#size");
      const fileInput = document.querySelector("#fileInput");
      const foldButton = document.querySelector("#foldButton");
      const unfoldButton = document.querySelector("#unfoldButton");

      function readInitialPayload() {
        const url = new URL(window.location.href);

        const queryContent =
          url.searchParams.get("code") ??
          url.searchParams.get("content") ??
          url.searchParams.get("text") ??
          url.searchParams.get("input");

        if (queryContent !== null) {
          return {
            content: queryContent,
            language:
              url.searchParams.get("lang") ??
              url.searchParams.get("language") ??
              "auto",
            filename:
              url.searchParams.get("filename") ??
              url.searchParams.get("name") ??
              "Shortcut Input",
          };
        }

        const rawHash = window.location.hash.slice(1);

        if (rawHash) {
          const hashParams = new URLSearchParams(rawHash);

          const hashContent =
            hashParams.get("code") ??
            hashParams.get("content") ??
            hashParams.get("text") ??
            hashParams.get("input");

          if (hashContent !== null) {
            return {
              content: hashContent,
              language:
                hashParams.get("lang") ??
                hashParams.get("language") ??
                "auto",
              filename:
                hashParams.get("filename") ??
                hashParams.get("name") ??
                "Shortcut Input",
            };
          }

          try {
            return {
              content: decodeURIComponent(rawHash),
              language: "auto",
              filename: "Shortcut Input",
            };
          } catch {
            return {
              content: rawHash,
              language: "auto",
              filename: "Shortcut Input",
            };
          }
        }

        const injected =
          window.SHORTCUT_INPUT ??
          window.shortcutInput ??
          window.__SHORTCUT_INPUT__;

        if (typeof injected === "string") {
          return {
            content: injected,
            language: "auto",
            filename: "Injected Input",
          };
        }

        if (injected && typeof injected === "object") {
          return {
            content:
              injected.content ??
              injected.code ??
              injected.text ??
              JSON.stringify(injected, null, 2),
            language:
              injected.language ??
              injected.lang ??
              "auto",
            filename:
              injected.filename ??
              injected.name ??
              "Injected Input",
          };
        }

        return {
          content: "",
          language: "auto",
          filename: "Previewer",
        };
      }

      function detectLanguage(content, filename = "") {
        const extension = filename
          .split(".")
          .pop()
          ?.toLowerCase();

        if (extension === "json") {
          return "json";
        }

        if (extension === "html" || extension === "htm") {
          return "html";
        }

        if (extension === "css") {
          return "css";
        }

        const trimmed = content.trim();

        if (!trimmed) {
          return "text";
        }

        try {
          JSON.parse(trimmed);
          return "json";
        } catch {}

        if (
          /^\s*(?:<!doctype\s+html|<html\b|<head\b|<body\b|<[a-z][^>]*>)/i.test(
            trimmed,
          )
        ) {
          return "html";
        }

        if (
          /(?:^|})\s*(?:@[\w-]+|[#.:[\]a-z][^{]+)\s*\{[\s\S]*:[^;{}]+;/i.test(
            trimmed,
          )
        ) {
          return "css";
        }

        return "text";
      }

      function normalizeLanguage(language, content, filename = "") {
        const normalized = String(language || "auto").toLowerCase();

        if (normalized === "xml" || normalized === "htm") {
          return "html";
        }

        if (
          normalized === "plaintext" ||
          normalized === "plain" ||
          normalized === "txt"
        ) {
          return "text";
        }

        if (
          normalized === "auto" ||
          !["json", "html", "css", "text"].includes(normalized)
        ) {
          return detectLanguage(content, filename);
        }

        return normalized;
      }

      function getDocument() {
        if (state.view) {
          return state.view.state.doc.toString();
        }

        return fallbackEditor.value;
      }

      function setDocument(content, options = {}) {
        const text =
          typeof content === "string"
            ? content
            : JSON.stringify(content, null, 2);

        state.currentFilename =
          options.filename ||
          state.currentFilename ||
          "Previewer";

        filenameElement.textContent = state.currentFilename;

        const language = normalizeLanguage(
          options.language || "auto",
          text,
          state.currentFilename,
        );

        state.currentLanguage = language;
        languageSelect.value = language;

        if (state.view) {
          state.view.dispatch({
            changes: {
              from: 0,
              to: state.view.state.doc.length,
              insert: text,
            },
            selection: {
              anchor: 0,
            },
            scrollIntoView: true,
          });

          setCodeMirrorLanguage(language);
        } else {
          fallbackEditor.value = text;
          fallbackEditor.scrollTop = 0;
          fallbackEditor.scrollLeft = 0;
          fallbackEditor.selectionStart = 0;
          fallbackEditor.selectionEnd = 0;
        }

        emptyElement.hidden = text.length > 0;
        updateStatus();
        setStatus(`Aberto como ${language.toUpperCase()}`);
      }

      function setCodeMirrorLanguage(language) {
        if (
          !state.view ||
          !state.codeMirrorApi ||
          !state.codeMirrorApi.languageCompartment
        ) {
          return;
        }

        const extension =
          state.codeMirrorApi.languageExtensions[language] ??
          state.codeMirrorApi.languageExtensions.text;

        state.view.dispatch({
          effects:
            state.codeMirrorApi.languageCompartment.reconfigure(
              extension,
            ),
        });
      }

      function setLanguage(language) {
        const normalized = normalizeLanguage(
          language,
          getDocument(),
          state.currentFilename,
        );

        state.currentLanguage = normalized;
        languageSelect.value = normalized;
        setCodeMirrorLanguage(normalized);
        setStatus(`Linguagem: ${normalized.toUpperCase()}`);
      }

      function updateStatus() {
        const content = getDocument();
        const bytes = new Blob([content]).size;

        sizeElement.textContent = formatBytes(bytes);

        let position = 0;

        if (state.view) {
          position = state.view.state.selection.main.head;
        } else {
          position = fallbackEditor.selectionStart || 0;
        }

        const beforeCursor = content.slice(0, position);
        const lines = beforeCursor.split("\n");
        const line = lines.length;
        const column = lines.at(-1).length + 1;

        positionElement.textContent = `Ln ${line}, Col ${column}`;
        emptyElement.hidden = content.length > 0;
      }

      function formatBytes(bytes) {
        if (bytes < 1024) {
          return `${bytes} B`;
        }

        if (bytes < 1024 ** 2) {
          return `${(bytes / 1024).toFixed(1)} KB`;
        }

        return `${(bytes / 1024 ** 2).toFixed(1)} MB`;
      }

      function setStatus(message, type = "normal") {
        statusElement.textContent = message;

        if (type === "error") {
          statusElement.style.color = "var(--danger)";
          return;
        }

        if (type === "success") {
          statusElement.style.color = "var(--success)";
          return;
        }

        statusElement.style.color = "";
      }

      function formatDocument() {
        const content = getDocument();

        try {
          if (state.currentLanguage === "json") {
            const formatted = JSON.stringify(
              JSON.parse(content),
              null,
              2,
            );

            setDocument(formatted, {
              language: "json",
              filename: state.currentFilename,
            });

            setStatus("JSON formatado", "success");
            return;
          }

          if (state.currentLanguage === "css") {
            setDocument(formatCss(content), {
              language: "css",
              filename: state.currentFilename,
            });

            setStatus("CSS formatado", "success");
            return;
          }

          if (state.currentLanguage === "html") {
            setDocument(formatHtml(content), {
              language: "html",
              filename: state.currentFilename,
            });

            setStatus("HTML formatado", "success");
            return;
          }

          setStatus(
            "Formatação disponível para JSON, HTML e CSS",
          );
        } catch (error) {
          setStatus(
            `Não foi possível formatar: ${error.message}`,
            "error",
          );
        }
      }

      function formatCss(source) {
        return source
          .replace(/\s*{\s*/g, " {\n")
          .replace(/;\s*/g, ";\n")
          .replace(/\s*}\s*/g, "\n}\n")
          .replace(/\n{3,}/g, "\n\n")
          .split("\n")
          .reduce(
            (result, rawLine) => {
              const line = rawLine.trim();

              if (!line) {
                if (result.lines.at(-1) !== "") {
                  result.lines.push("");
                }

                return result;
              }

              if (line.startsWith("}")) {
                result.depth = Math.max(0, result.depth - 1);
              }

              result.lines.push(
                `${"  ".repeat(result.depth)}${line}`,
              );

              if (line.endsWith("{")) {
                result.depth += 1;
              }

              return result;
            },
            {
              depth: 0,
              lines: [],
            },
          )
          .lines.join("\n")
          .trim();
      }

      function formatHtml(source) {
        const tokens = source
          .replace(/>\s*</g, "><")
          .split(/(<[^>]+>)/g)
          .filter(Boolean);

        const voidTag =
          /^<(?:area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b/i;

        const lines = [];
        let depth = 0;

        for (const token of tokens) {
          const value = token.trim();

          if (!value) {
            continue;
          }

          const closing = /^<\//.test(value);
          const special = /^<(?:!|\?)/.test(value);
          const opening =
            /^<[a-z][^>]*>$/i.test(value) &&
            !/\/>$/.test(value) &&
            !voidTag.test(value) &&
            !closing &&
            !special;

          if (closing) {
            depth = Math.max(0, depth - 1);
          }

          lines.push(`${"  ".repeat(depth)}${value}`);

          if (opening) {
            depth += 1;
          }
        }

        return lines.join("\n");
      }

      async function pasteClipboard() {
        try {
          const text = await navigator.clipboard.readText();

          if (!text) {
            setStatus(
              "A área de transferência está vazia",
            );
            return;
          }

          setDocument(text, {
            language: "auto",
            filename: "Clipboard",
          });

          setStatus(
            "Conteúdo colado",
            "success",
          );
        } catch {
          setStatus(
            "O Safari bloqueou a leitura. Toque no editor e use Colar.",
            "error",
          );
        }
      }

      async function copyDocument() {
        const content = getDocument();

        try {
          await navigator.clipboard.writeText(content);
          setStatus("Conteúdo copiado", "success");
        } catch {
          const textarea = document.createElement("textarea");

          textarea.value = content;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.append(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();

          setStatus("Conteúdo copiado", "success");
        }
      }

      async function initializeCodeMirror() {
        try {
          setStatus("Carregando CodeMirror 6");

          const [
            codemirrorModule,
            stateModule,
            viewModule,
            languageModule,
            jsonModule,
            htmlModule,
            cssModule,
            themeModule,
          ] = await Promise.all([
            import("https://esm.sh/codemirror@6.0.2?target=es2022"),
            import("https://esm.sh/@codemirror/state@6.5.2?target=es2022"),
            import("https://esm.sh/@codemirror/view@6.38.1?target=es2022"),
            import("https://esm.sh/@codemirror/language@6.11.2?target=es2022"),
            import("https://esm.sh/@codemirror/lang-json@6.0.2?target=es2022"),
            import("https://esm.sh/@codemirror/lang-html@6.4.9?target=es2022"),
            import("https://esm.sh/@codemirror/lang-css@6.3.1?target=es2022"),
            import("https://esm.sh/@codemirror/theme-one-dark@6.1.3?target=es2022"),
          ]);

          const {
            basicSetup,
          } = codemirrorModule;

          const {
            EditorState,
            Compartment,
          } = stateModule;

          const {
            EditorView,
            keymap,
            lineWrapping,
          } = viewModule;

          const {
            foldAll,
            unfoldAll,
            foldGutter,
            foldKeymap,
            indentOnInput,
          } = languageModule;

          const {
            json,
          } = jsonModule;

          const {
            html,
          } = htmlModule;

          const {
            css,
          } = cssModule;

          const {
            oneDark,
          } = themeModule;

          const languageCompartment = new Compartment();

          const languageExtensions = {
            json: json(),
            html: html(),
            css: css(),
            text: [],
          };

          const currentContent = fallbackEditor.value;

          fallbackEditor.hidden = true;

          const view = new EditorView({
            parent: editorHost,
            state: EditorState.create({
              doc: currentContent,
              extensions: [
                basicSetup,
                oneDark,
                lineWrapping,
                foldGutter(),
                indentOnInput(),
                keymap.of(foldKeymap),
                languageCompartment.of(
                  languageExtensions[
                    state.currentLanguage
                  ] ?? languageExtensions.text,
                ),
                EditorView.updateListener.of((update) => {
                  if (
                    update.docChanged ||
                    update.selectionSet
                  ) {
                    updateStatus();
                  }
                }),
                EditorView.theme({
                  "&": {
                    height: "100%",
                  },
                  ".cm-scroller": {
                    overflow: "auto",
                  },
                }),
              ],
            }),
          });

          state.view = view;
          state.codeMirrorReady = true;
          state.codeMirrorApi = {
            foldAll,
            unfoldAll,
            languageCompartment,
            languageExtensions,
          };

          foldButton.disabled = false;
          unfoldButton.disabled = false;

          updateStatus();
          setStatus("CodeMirror 6 carregado", "success");
        } catch (error) {
          console.error(
            "[Previewer] Falha ao carregar CodeMirror 6:",
            error,
          );

          state.codeMirrorReady = false;
          foldButton.disabled = true;
          unfoldButton.disabled = true;

          setStatus(
            "CodeMirror falhou. Editor simples ativado.",
            "error",
          );
        }
      }

      document
        .querySelector("#openButton")
        .addEventListener("click", () => {
          fileInput.click();
        });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];

        if (!file) {
          return;
        }

        setDocument(await file.text(), {
          language: "auto",
          filename: file.name,
        });

        fileInput.value = "";
      });

      document
        .querySelector("#pasteButton")
        .addEventListener("click", pasteClipboard);

      document
        .querySelector("#copyButton")
        .addEventListener("click", copyDocument);

      document
        .querySelector("#formatButton")
        .addEventListener("click", formatDocument);

      foldButton.addEventListener("click", () => {
        if (
          !state.view ||
          !state.codeMirrorApi
        ) {
          setStatus(
            "Fold exige o CodeMirror 6",
            "error",
          );
          return;
        }

        const changed =
          state.codeMirrorApi.foldAll(state.view);

        setStatus(
          changed
            ? "Blocos recolhidos"
            : "Nenhum bloco recolhível",
        );
      });

      unfoldButton.addEventListener("click", () => {
        if (
          !state.view ||
          !state.codeMirrorApi
        ) {
          setStatus(
            "Unfold exige o CodeMirror 6",
            "error",
          );
          return;
        }

        const changed =
          state.codeMirrorApi.unfoldAll(state.view);

        setStatus(
          changed
            ? "Blocos expandidos"
            : "Nenhum bloco recolhido",
        );
      });

      languageSelect.addEventListener("change", () => {
        const selected = languageSelect.value;

        const language =
          selected === "auto"
            ? detectLanguage(
                getDocument(),
                state.currentFilename,
              )
            : selected;

        setLanguage(language);
      });

      fallbackEditor.addEventListener(
        "input",
        updateStatus,
      );

      fallbackEditor.addEventListener(
        "keyup",
        updateStatus,
      );

      fallbackEditor.addEventListener(
        "click",
        updateStatus,
      );

      window.ShortcutCodeViewer = Object.freeze({
        getValue() {
          return getDocument();
        },

        setValue(content, options = {}) {
          setDocument(content, options);
        },

        setLanguage(language) {
          setLanguage(language);
        },

        fold() {
          if (
            !state.view ||
            !state.codeMirrorApi
          ) {
            return false;
          }

          return state.codeMirrorApi.foldAll(
            state.view,
          );
        },

        unfold() {
          if (
            !state.view ||
            !state.codeMirrorApi
          ) {
            return false;
          }

          return state.codeMirrorApi.unfoldAll(
            state.view,
          );
        },

        focus() {
          if (state.view) {
            state.view.focus();
            return;
          }

          fallbackEditor.focus();
        },

        isCodeMirrorReady() {
          return state.codeMirrorReady;
        },
      });

      const initial = readInitialPayload();

      setDocument(initial.content, {
        language: initial.language,
        filename: initial.filename,
      });

      foldButton.disabled = true;
      unfoldButton.disabled = true;

      initializeCodeMirror();
    })();
  </script>
</body>
</html>
